<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B2559">
<meta name="description" content="فاکتورینو؛ ساخت پیش‌فاکتور و فاکتور فارسی با تاریخ شمسی و مبلغ به حروف">
<title>فاکتورینو</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --desk:#E4E6DD; --paper:#FFFFFF; --ink:#1B2559; --ink2:#4B5380;
  --line:#CFD3C4; --stamp:#C23B2E; --muted:#7C8197; --field:#F3F4EE; --ok:#2F7D5B;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--desk); color:var(--ink);
  font-family:"Vazirmatn","Vazir","IRANSans",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;
  line-height:1.7; padding-bottom:calc(88px + env(safe-area-inset-bottom));
}
button,input,textarea,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--stamp); outline-offset:2px}

/* top bar */
.top{
  background:var(--ink); color:#fff; display:flex; align-items:center; justify-content:space-between;
  padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top));
}
.top h1{margin:0; font-size:21px; font-weight:800; letter-spacing:0}
.top-actions{display:flex; gap:6px}
.top button{
  background:transparent; border:1px solid rgba(255,255,255,.35); color:#fff;
  border-radius:8px; padding:5px 11px; font-size:14px;
}
.top button:active{background:rgba(255,255,255,.15)}

main{max-width:780px; margin:0 auto; padding:12px 10px}

/* doc type switch */
.seg{display:grid; grid-template-columns:1fr 1fr; background:#D2D5C9; border-radius:10px; padding:3px; margin-bottom:12px}
.seg button{border:0; background:transparent; padding:8px; border-radius:8px; font-weight:700; color:var(--ink2)}
.seg button.on{background:var(--paper); color:var(--ink); box-shadow:0 1px 2px rgba(27,37,89,.18)}

/* the paper sheet */
.sheet{
  background:var(--paper); border-top:6px solid var(--ink); padding:16px 14px 18px;
  box-shadow:0 1px 0 rgba(27,37,89,.08), 0 6px 18px rgba(27,37,89,.08);
}
.sheet-head{display:grid; gap:14px; padding-bottom:12px; border-bottom:3px double var(--line)}
.seller{display:flex; gap:10px; align-items:center; min-height:48px}
.seller img{width:56px; height:56px; object-fit:contain}
.shop-name{font-weight:800; font-size:18px; line-height:1.4}
.shop-name.ph{color:var(--muted); font-weight:500; font-size:15px}
.shop-meta{font-size:13px; color:var(--ink2)}
.doc-title{font-size:24px; font-weight:800; margin-bottom:2px}
.meta{display:grid; gap:2px}

.lbl{display:block; font-size:12.5px; color:var(--muted)}
.fld{display:block}
.sheet input,.sheet textarea,dialog input,dialog textarea,dialog select{
  width:100%; border:0; border-bottom:1px dashed #B3B8A6; background:transparent; border-radius:0;
  padding:5px 2px; font-size:16px; color:var(--ink);
}
.sheet input::placeholder,.sheet textarea::placeholder{color:#A9AEBF}
.sheet input:focus,.sheet textarea:focus{border-bottom:1px solid var(--ink); outline:none; background:var(--field)}

.party{display:grid; gap:10px; padding:12px 0; border-bottom:1px solid var(--line)}

/* items */
.items-head{display:none}
.row{
  display:grid; grid-template-columns:22px 1fr 1fr 1fr 24px;
  grid-template-areas:"n d d d x" ". q p t .";
  gap:2px 8px; padding:8px 0; border-bottom:1px solid var(--line); align-items:end;
}
.row .n{grid-area:n; color:var(--muted); font-size:14px; padding-bottom:6px}
.row .d{grid-area:d}
.row .q{grid-area:q; text-align:center}
.row .p{grid-area:p; text-align:center}
.row .t{grid-area:t; font-weight:700; text-align:left; padding:5px 2px; font-size:16px}
.row .x{
  grid-area:x; border:0; background:transparent; color:var(--stamp); font-size:22px; line-height:1;
  padding:0 0 6px; align-self:end;
}
.add{
  margin-top:10px; width:100%; background:var(--field); border:1px dashed #A9AE9B; border-radius:8px;
  padding:9px; color:var(--ink); font-weight:700;
}

/* totals */
.totals{margin-top:14px; display:grid; gap:4px}
.line{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:4px 0; border-bottom:1px dotted var(--line)}
.line .v{font-weight:700}
.line input{width:130px; text-align:left}
.line input.short{width:64px}
.stamp{
  margin-top:14px; border:2px solid var(--stamp); color:var(--stamp); border-radius:6px;
  padding:10px 14px 12px; position:relative;
}
.stamp::before{content:""; position:absolute; inset:3px; border:1px solid var(--stamp); border-radius:3px; opacity:.45; pointer-events:none}
.stamp .cap{font-size:13px; font-weight:700}
.stamp .amt{font-size:30px; font-weight:800; line-height:1.3}
.stamp .amt small{font-size:15px; font-weight:700; margin-inline-start:6px}
.stamp .words{font-size:13.5px; line-height:1.6; margin-top:2px}
.notes{margin-top:16px}
.notes textarea{resize:vertical; min-height:56px; border:1px dashed #B3B8A6; padding:6px 8px}
.sign{display:none}

/* bottom bar */
.bar{
  position:fixed; left:0; right:0; bottom:0; width:100%; background:var(--paper); border-top:1px solid var(--line);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom)); display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1.1fr) minmax(0,1fr) minmax(0,.8fr); gap:6px;
  z-index:5;
}
.bar button{border:1px solid var(--line); background:var(--field); border-radius:9px; padding:10px 2px; font-weight:700; font-size:14px; white-space:nowrap; min-width:0}
.bar button.primary{background:var(--ink); color:#fff; border-color:var(--ink)}
.bar button:active{transform:translateY(1px)}

/* dialogs */
dialog{border:0; border-radius:12px; padding:0; width:min(94vw,520px); max-height:88vh; color:var(--ink); background:var(--paper)}
dialog::backdrop{background:rgba(20,25,60,.55)}
.dh{display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); font-weight:800}
.dh button{border:0; background:transparent; font-size:24px; line-height:1}
.db{padding:12px 16px; overflow:auto; max-height:62vh; display:grid; gap:10px}
.df{padding:12px 16px; border-top:1px solid var(--line); display:flex; gap:8px}
.btn{border:1px solid var(--line); background:var(--field); border-radius:9px; padding:9px 14px; font-weight:700}
.btn.primary{background:var(--ink); color:#fff; border-color:var(--ink)}
.btn.danger{color:var(--stamp)}
.two{display:grid; grid-template-columns:1fr 1fr; gap:10px}
dialog select{border:1px solid var(--line); border-radius:8px; padding:7px; background:#fff}
dialog textarea{border:1px solid var(--line); border-radius:8px; padding:6px 8px}
.logo-prev{display:flex; align-items:center; gap:10px}
.logo-prev img{width:48px; height:48px; object-fit:contain; border:1px solid var(--line); border-radius:6px}
.rec{display:grid; grid-template-columns:1fr auto; gap:6px; border-bottom:1px solid var(--line); padding-bottom:8px}
.rec .open{display:grid; text-align:start; border:0; background:transparent; padding:2px}
.rec .open span{font-size:13px; color:var(--ink2)}
.rec .open .amt{color:var(--stamp); font-weight:700}
.rec .del{border:0; background:transparent; color:var(--stamp); font-size:14px}
.empty{color:var(--muted); margin:8px 0}
.hint{font-size:12.5px; color:var(--muted); margin:0}

#toast{
  position:fixed; inset-inline:0; bottom:calc(86px + env(safe-area-inset-bottom)); margin:auto; width:max-content; max-width:90vw;
  background:var(--ink); color:#fff; padding:8px 16px; border-radius:20px; font-size:14px; opacity:0; pointer-events:none;
  transition:opacity .2s; z-index:20;
}
#toast.show{opacity:1}

@media (min-width:640px){
  main{padding:20px 12px}
  .sheet{padding:26px 28px 28px}
  .sheet-head{grid-template-columns:1fr auto; align-items:start}
  .meta{min-width:210px}
  .party{grid-template-columns:2fr 1fr}
  .items-head{
    display:grid; grid-template-columns:28px 1fr 70px 120px 120px 28px; gap:8px; margin-top:12px;
    padding:6px 0; border-bottom:2px solid var(--ink); font-size:13px; font-weight:700; color:var(--ink2);
  }
  .items-head span:nth-child(3),.items-head span:nth-child(4){text-align:center}
  .items-head span:nth-child(5){text-align:left}
  .row{grid-template-columns:28px 1fr 70px 120px 120px 28px; grid-template-areas:"n d q p t x"; align-items:center}
  .row .n{padding-bottom:0}
  .row .x{padding:0}
  .totals{margin-inline-start:auto; width:min(100%,340px)}
  .row input.q::placeholder,.row input.p::placeholder{color:transparent}
}

@media print{
  @page{size:A4; margin:14mm}
  body{background:#fff; padding:0}
  .top,.seg,.bar,.add,.x,dialog,#toast{display:none!important}
  main{max-width:none; padding:0}
  .sheet{box-shadow:none; border-top:0; padding:0}
  .sheet input,.sheet textarea{border-color:transparent!important; background:transparent!important}
  .sheet ::placeholder{color:transparent!important}
  .row{break-inside:avoid}
  .items-head{display:grid; grid-template-columns:28px 1fr 70px 120px 120px 28px; gap:8px; padding:6px 0; border-bottom:2px solid #000; font-size:12px; font-weight:700; margin-top:12px}
  .items-head span:nth-child(3),.items-head span:nth-child(4){text-align:center}
  .items-head span:nth-child(5){text-align:left}
  .row{grid-template-columns:28px 1fr 70px 120px 120px 28px; grid-template-areas:"n d q p t x"; align-items:center}
  .row .x{visibility:hidden}
  .sheet-head{grid-template-columns:1fr auto}
  .party{grid-template-columns:2fr 1fr}
  .totals{margin-inline-start:auto; width:340px}
  .notes textarea{border:0; min-height:0}
  .sign{display:grid; grid-template-columns:1fr 1fr; gap:40px; margin-top:42px; text-align:center; font-size:13px}
  .sign div{border-top:1px solid #000; padding-top:4px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <h1>فاکتورینو</h1>
  <div class="top-actions">
    <button id="btnInstall" hidden>نصب</button>
    <button id="btnSaved">ذخیره‌شده‌ها</button>
    <button id="btnSettings">تنظیمات</button>
  </div>
</header>

<main>
  <div class="seg" role="group" aria-label="نوع سند">
    <button type="button" data-type="pre" class="on">پیش‌فاکتور</button>
    <button type="button" data-type="inv">فاکتور فروش</button>
  </div>

  <article id="sheet" class="sheet">
    <div class="sheet-head">
      <div class="seller">
        <img id="shopLogo" alt="" hidden>
        <div>
          <div id="shopName" class="shop-name"></div>
          <div id="shopPhone" class="shop-meta"></div>
          <div id="shopAddr" class="shop-meta"></div>
        </div>
      </div>
      <div class="meta">
        <div id="docTitle" class="doc-title">پیش‌فاکتور</div>
        <label class="fld"><span class="lbl">شماره</span><input id="fNumber" inputmode="numeric" autocomplete="off"></label>
        <label class="fld"><span class="lbl">تاریخ</span><input id="fDate" inputmode="numeric" autocomplete="off"></label>
      </div>
    </div>

    <section class="party">
      <label class="fld"><span class="lbl">خریدار</span><input id="cName" placeholder="نام مشتری یا شرکت" autocomplete="off"></label>
      <label class="fld"><span class="lbl">تلفن</span><input id="cPhone" inputmode="tel" placeholder="۰۹۱۲..." autocomplete="off"></label>
    </section>

    <section>
      <div class="items-head"><span>#</span><span>شرح کالا یا خدمات</span><span>تعداد</span><span>قیمت واحد</span><span>جمع</span><span></span></div>
      <div id="items"></div>
      <button type="button" id="addItem" class="add">افزودن ردیف</button>
    </section>

    <section class="totals">
      <div class="line"><span>جمع اقلام</span><span class="v" id="tSub">۰</span></div>
      <div class="line"><span>تخفیف</span><input id="fDisc" inputmode="numeric" placeholder="۰" aria-label="مبلغ تخفیف"></div>
      <div class="line">
        <span>مالیات (درصد)</span>
        <span style="display:flex;align-items:center;gap:8px"><input id="fTax" class="short" inputmode="decimal" placeholder="۰" aria-label="درصد مالیات"><span class="v" id="tTax">۰</span></span>
      </div>
      <div class="stamp">
        <div class="cap">مبلغ قابل پرداخت</div>
        <div class="amt"><span id="tTotal">۰</span><small id="tUnit">تومان</small></div>
        <div class="words" id="tWords"></div>
      </div>
    </section>

    <section class="notes">
      <label class="fld"><span class="lbl">توضیحات</span><textarea id="fNotes" rows="2" placeholder="شرایط پرداخت، مدت اعتبار پیش‌فاکتور و ..."></textarea></label>
    </section>

    <div class="sign"><div>امضای فروشنده</div><div>امضای خریدار</div></div>
  </article>
</main>

<nav class="bar" aria-label="عملیات">
  <button type="button" id="btnSave" class="primary">ذخیره</button>
  <button type="button" id="btnPrint">چاپ / PDF</button>
  <button type="button" id="btnShare">اشتراک</button>
  <button type="button" id="btnNew">جدید</button>
</nav>

<div id="toast" role="status" aria-live="polite"></div>

<dialog id="dlgSettings">
  <div class="dh"><span>تنظیمات فروشنده</span><button type="button" data-close aria-label="بستن">×</button></div>
  <div class="db">
    <label class="fld"><span class="lbl">نام فروشگاه یا کسب‌وکار</span><input id="sShop" autocomplete="off"></label>
    <div class="two">
      <label class="fld"><span class="lbl">تلفن</span><input id="sPhone" inputmode="tel" autocomplete="off"></label>
      <label class="fld"><span class="lbl">واحد پول</span>
        <select id="sUnit"><option>تومان</option><option>ریال</option></select></label>
    </div>
    <label class="fld"><span class="lbl">نشانی</span><input id="sAddr" autocomplete="off"></label>
    <div class="two">
      <label class="fld"><span class="lbl">مالیات پیش‌فرض (درصد)</span><input id="sTax" inputmode="decimal" placeholder="۰"></label>
      <label class="fld"><span class="lbl">شماره‌ی فاکتور بعدی</span><input id="sNext" inputmode="numeric"></label>
    </div>
    <label class="fld"><span class="lbl">توضیحات پیش‌فرض</span><textarea id="sNotes" rows="2"></textarea></label>
    <div>
      <span class="lbl">لوگو</span>
      <div class="logo-prev">
        <img id="sLogoPrev" alt="" hidden>
        <input id="sLogo" type="file" accept="image/*">
        <button type="button" class="btn danger" id="sLogoDel" hidden>حذف</button>
      </div>
    </div>
    <p class="hint">اطلاعات فقط روی همین دستگاه ذخیره می‌شود. از پشتیبان‌گیری برای انتقال یا نگهداری نسخه‌ی اضافه استفاده کنید.</p>
    <div class="two">
      <button type="button" class="btn" id="btnExport">دریافت پشتیبان</button>
      <label class="btn" style="text-align:center">بازیابی پشتیبان<input id="fImport" type="file" accept="application/json" hidden></label>
    </div>
  </div>
  <div class="df"><button type="button" class="btn primary" id="sSave">ذخیره تنظیمات</button><button type="button" class="btn" data-close>بستن</button></div>
</dialog>

<dialog id="dlgSaved">
  <div class="dh"><span>فاکتورهای ذخیره‌شده</span><button type="button" data-close aria-label="بستن">×</button></div>
  <div class="db" id="savedList"></div>
</dialog>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const FA='۰۱۲۳۴۵۶۷۸۹';
const toFa=s=>String(s).replace(/\d/g,d=>FA[d]);
const toEn=s=>String(s)
  .replace(/[۰-۹]/g,d=>FA.indexOf(d))
  .replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))
  .replace(/[٬،,]/g,'').replace(/٫/g,'.');
const num=s=>{const v=parseFloat(toEn(s));return Number.isFinite(v)?v:0};
const group=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'٬');
const money=n=>toFa(group(n));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');

/* ---------- Jalali date ---------- */
function g2j(gy,gm,gd){
  const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];
  let jy=(gy<=1600)?0:979; gy-=(gy<=1600)?621:1600;
  const gy2=(gm>2)?(gy+1):gy;
  let days=(365*gy)+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+gdm[gm-1];
  jy+=33*Math.floor(days/12053); days%=12053;
  jy+=4*Math.floor(days/1461); days%=1461;
  if(days>365){jy+=Math.floor((days-1)/365); days=(days-1)%365;}
  const jm=(days<186)?1+Math.floor(days/31):7+Math.floor((days-186)/30);
  const jd=1+((days<186)?(days%31):((days-186)%30));
  return [jy,jm,jd];
}
function todayJ(){const d=new Date();const [y,m,dd]=g2j(d.getFullYear(),d.getMonth()+1,d.getDate());return toFa(y+'/'+pad(m)+'/'+pad(dd))}

/* ---------- number to Persian words ---------- */
const O=['','یک','دو','سه','چهار','پنج','شش','هفت','هشت','نه'];
const T=['ده','یازده','دوازده','سیزده','چهارده','پانزده','شانزده','هفده','هجده','نوزده'];
const D=['','','بیست','سی','چهل','پنجاه','شصت','هفتاد','هشتاد','نود'];
const H=['','صد','دویست','سیصد','چهارصد','پانصد','ششصد','هفتصد','هشتصد','نهصد'];
const SC=['','هزار','میلیون','میلیارد','هزار میلیارد'];
function w3(n){
  const p=[],a=Math.floor(n/100),b=n%100;
  if(a)p.push(H[a]);
  if(b>=20){p.push(D[Math.floor(b/10)]); if(b%10)p.push(O[b%10]);}
  else if(b>=10)p.push(T[b-10]);
  else if(b)p.push(O[b]);
  return p.join(' و ');
}
function words(n){
  n=Math.round(n);
  if(n<=0)return '';
  if(n>=1e15)return '';
  const parts=[];let i=0;
  while(n>0){const g=n%1000; if(g)parts.unshift(w3(g)+(SC[i]?' '+SC[i]:'')); n=Math.floor(n/1000); i++;}
  return parts.join(' و ');
}

/* ---------- storage ---------- */
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('ذخیره‌سازی ممکن نیست؛ حافظه‌ی مرورگر را بررسی کنید');return false}}
};
let S=Object.assign({shop:'',phone:'',address:'',logo:'',unit:'تومان',tax:'',next:1,notes:''},store.get('fk_settings',{}));
const newDoc=()=>({id:null,type:'pre',number:toFa(S.next),date:todayJ(),cName:'',cPhone:'',
  items:[{d:'',q:'۱',p:''}],discount:'',tax:S.tax?toFa(S.tax):'',notes:S.notes||''});
let doc=newDoc();
let dirty=false;

/* ---------- calculation ---------- */
function calc(){
  const rows=doc.items.map(it=>num(it.q)*num(it.p));
  const sub=rows.reduce((a,b)=>a+b,0);
  const disc=Math.min(num(doc.discount),sub);
  const base=sub-disc;
  const tax=base*num(doc.tax)/100;
  return {rows,sub,disc,base,tax,total:Math.round(base+tax)};
}

/* ---------- render ---------- */
function renderHead(){
  const n=$('#shopName');
  n.textContent=S.shop||'نام فروشگاه را در تنظیمات وارد کنید';
  n.classList.toggle('ph',!S.shop);
  $('#shopPhone').textContent=S.phone?toFa(S.phone):'';
  $('#shopAddr').textContent=S.address||'';
  const img=$('#shopLogo');
  if(S.logo){img.src=S.logo;img.hidden=false}else{img.hidden=true;img.removeAttribute('src')}
  $('#docTitle').textContent=doc.type==='inv'?'فاکتور فروش':'پیش‌فاکتور';
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.type===doc.type));
  $('#tUnit').textContent=S.unit;
}
function renderItems(){
  $('#items').innerHTML=doc.items.map((it,i)=>`
    <div class="row" data-i="${i}">
      <span class="n">${toFa(i+1)}</span>
      <input class="d" placeholder="شرح کالا یا خدمات" value="${esc(it.d)}" aria-label="شرح ردیف ${toFa(i+1)}" autocomplete="off">
      <input class="q" inputmode="decimal" placeholder="تعداد" value="${esc(it.q)}" aria-label="تعداد">
      <input class="p" inputmode="numeric" placeholder="قیمت واحد" value="${esc(it.p)}" aria-label="قیمت واحد">
      <span class="t">${money(num(it.q)*num(it.p))}</span>
      <button type="button" class="x" aria-label="حذف ردیف">×</button>
    </div>`).join('');
}
function renderTotals(){
  const c=calc();
  document.querySelectorAll('#items .row').forEach((r,i)=>{r.querySelector('.t').textContent=money(c.rows[i]||0)});
  $('#tSub').textContent=money(c.sub);
  $('#tTax').textContent=money(c.tax);
  $('#tTotal').textContent=money(c.total);
  const w=words(c.total);
  $('#tWords').textContent=w?(w+' '+S.unit):'';
}
function syncFields(){
  $('#fNumber').value=doc.number; $('#fDate').value=doc.date;
  $('#cName').value=doc.cName; $('#cPhone').value=doc.cPhone;
  $('#fDisc').value=doc.discount; $('#fTax').value=doc.tax; $('#fNotes').value=doc.notes;
}
function renderAll(){renderHead();syncFields();renderItems();renderTotals()}

/* ---------- toast ---------- */
let tt;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}

/* ---------- events: header fields ---------- */
const bind=(id,key)=>$(id).addEventListener('input',e=>{doc[key]=e.target.value;dirty=true});
bind('#fNumber','number');bind('#fDate','date');bind('#cName','cName');bind('#cPhone','cPhone');bind('#fNotes','notes');
$('#fDisc').addEventListener('input',e=>{doc.discount=e.target.value;dirty=true;renderTotals()});
$('#fTax').addEventListener('input',e=>{doc.tax=e.target.value;dirty=true;renderTotals()});
$('#fDisc').addEventListener('blur',e=>{if(e.target.value.trim()){doc.discount=money(num(e.target.value));e.target.value=doc.discount}});
$('#fTax').addEventListener('blur',e=>{if(e.target.value.trim()){doc.tax=toFa(num(e.target.value));e.target.value=doc.tax}});
['#fNumber','#fDate','#cPhone'].forEach(id=>$(id).addEventListener('blur',e=>{e.target.value=toFa(e.target.value);doc[id==='#fNumber'?'number':id==='#fDate'?'date':'cPhone']=e.target.value}));

document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{doc.type=b.dataset.type;dirty=true;renderHead()}));

/* ---------- events: items ---------- */
$('#items').addEventListener('input',e=>{
  const row=e.target.closest('.row'); if(!row)return;
  const it=doc.items[+row.dataset.i];
  if(e.target.classList.contains('d'))it.d=e.target.value;
  else if(e.target.classList.contains('q'))it.q=e.target.value;
  else if(e.target.classList.contains('p'))it.p=e.target.value;
  dirty=true; renderTotals();
});
$('#items').addEventListener('focusout',e=>{
  const row=e.target.closest('.row'); if(!row)return;
  const it=doc.items[+row.dataset.i];
  if(e.target.classList.contains('p')&&e.target.value.trim()){it.p=money(num(e.target.value));e.target.value=it.p}
  if(e.target.classList.contains('q')&&e.target.value.trim()){it.q=toFa(num(e.target.value));e.target.value=it.q}
});
$('#items').addEventListener('click',e=>{
  if(!e.target.classList.contains('x'))return;
  const i=+e.target.closest('.row').dataset.i;
  if(doc.items.length===1)doc.items[0]={d:'',q:'۱',p:''}; else doc.items.splice(i,1);
  dirty=true; renderItems(); renderTotals();
});
$('#addItem').addEventListener('click',()=>{
  doc.items.push({d:'',q:'۱',p:''}); dirty=true; renderItems(); renderTotals();
  const rows=document.querySelectorAll('#items .row'); rows[rows.length-1].querySelector('.d').focus();
});

/* ---------- save / list ---------- */
function save(){
  if(!doc.id)doc.id=Date.now();
  const list=store.get('fk_inv',[]);
  const rec=JSON.parse(JSON.stringify(doc));
  rec.total=calc().total; rec.unit=S.unit; rec.saved=Date.now();
  const i=list.findIndex(x=>x.id===doc.id);
  if(i>-1)list[i]=rec; else list.unshift(rec);
  if(!store.set('fk_inv',list))return;
  const n=Math.round(num(doc.number));
  if(n>=S.next){S.next=n+1;store.set('fk_settings',S)}
  dirty=false; toast('ذخیره شد');
}
function openSaved(){
  const list=store.get('fk_inv',[]);
  const box=$('#savedList');
  box.innerHTML=list.length?list.map(r=>`
    <div class="rec" data-id="${r.id}">
      <button type="button" class="open">
        <b>${r.type==='inv'?'فاکتور':'پیش‌فاکتور'} ${esc(r.number||'')}</b>
        <span>${esc(r.cName||'بدون نام مشتری')}</span>
        <span>${esc(r.date||'')}</span>
        <span class="amt">${money(r.total||0)} ${esc(r.unit||'')}</span>
      </button>
      <button type="button" class="del">حذف</button>
    </div>`).join(''):'<p class="empty">هنوز فاکتوری ذخیره نکرده‌اید. فاکتور را پر کنید و «ذخیره» را بزنید.</p>';
  $('#dlgSaved').showModal();
}
$('#savedList').addEventListener('click',e=>{
  const rec=e.target.closest('.rec'); if(!rec)return;
  const id=+rec.dataset.id, list=store.get('fk_inv',[]);
  if(e.target.closest('.del')){
    if(!confirm('این فاکتور حذف شود؟'))return;
    store.set('fk_inv',list.filter(x=>x.id!==id)); openSaved$();
  }else if(e.target.closest('.open')){
    const r=list.find(x=>x.id===id); if(!r)return;
    doc=JSON.parse(JSON.stringify(r)); delete doc.total; delete doc.unit; delete doc.saved;
    dirty=false; renderAll(); $('#dlgSaved').close();
  }
});
function openSaved$(){$('#dlgSaved').close();openSaved()}

$('#btnSave').addEventListener('click',save);
$('#btnSaved').addEventListener('click',openSaved);
$('#btnNew').addEventListener('click',()=>{
  if(dirty&&!confirm('تغییرات ذخیره‌نشده از بین می‌رود. فاکتور جدید ساخته شود؟'))return;
  doc=newDoc(); dirty=false; renderAll(); window.scrollTo({top:0});
});

/* ---------- print / share ---------- */
$('#btnPrint').addEventListener('click',()=>{
  const old=document.title;
  document.title=(doc.type==='inv'?'فاکتور':'پیش‌فاکتور')+'-'+toEn(doc.number||'');
  window.print();
  setTimeout(()=>{document.title=old},500);
});
function summary(){
  const c=calc(), t=doc.type==='inv'?'فاکتور فروش':'پیش‌فاکتور';
  let s=(S.shop?S.shop+'\n':'')+`${t} شماره ${doc.number}\nتاریخ: ${doc.date}\n`;
  if(doc.cName)s+=`خریدار: ${doc.cName}\n`;
  s+='\n';
  doc.items.forEach((it,i)=>{if(it.d||num(it.p))s+=`${toFa(i+1)}. ${it.d||'-'}: ${toFa(num(it.q))} × ${money(num(it.p))} = ${money(c.rows[i])}\n`});
  if(c.disc)s+=`\nتخفیف: ${money(c.disc)}`;
  if(num(doc.tax))s+=`\nمالیات (${toFa(num(doc.tax))} درصد): ${money(c.tax)}`;
  s+=`\nمبلغ قابل پرداخت: ${money(c.total)} ${S.unit}`;
  if(doc.notes)s+=`\n\n${doc.notes}`;
  return s;
}
$('#btnShare').addEventListener('click',async()=>{
  const text=summary();
  try{
    if(navigator.share){await navigator.share({text});return}
    await navigator.clipboard.writeText(text); toast('متن فاکتور کپی شد');
  }catch(e){if(e&&e.name!=='AbortError')toast('اشتراک‌گذاری ممکن نشد')}
});

/* ---------- settings ---------- */
let tmpLogo='';
function showLogo(){
  const im=$('#sLogoPrev'); im.hidden=!tmpLogo; if(tmpLogo)im.src=tmpLogo; $('#sLogoDel').hidden=!tmpLogo;
}
$('#btnSettings').addEventListener('click',()=>{
  $('#sShop').value=S.shop; $('#sPhone').value=S.phone; $('#sAddr').value=S.address;
  $('#sUnit').value=S.unit; $('#sTax').value=S.tax?toFa(S.tax):''; $('#sNext').value=toFa(S.next);
  $('#sNotes').value=S.notes||''; tmpLogo=S.logo||''; $('#sLogo').value=''; showLogo();
  $('#dlgSettings').showModal();
});
$('#sLogo').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{
    const k=Math.min(1,240/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));
    c.getContext('2d').drawImage(img,0,0,c.width,c.height); tmpLogo=c.toDataURL('image/png'); showLogo();
  };img.src=r.result};
  r.readAsDataURL(f);
});
$('#sLogoDel').addEventListener('click',()=>{tmpLogo='';$('#sLogo').value='';showLogo()});
$('#sSave').addEventListener('click',()=>{
  S.shop=$('#sShop').value.trim(); S.phone=toEn($('#sPhone').value).trim(); S.address=$('#sAddr').value.trim();
  S.unit=$('#sUnit').value; S.tax=num($('#sTax').value)||''; S.next=Math.max(1,Math.round(num($('#sNext').value))||1);
  S.notes=$('#sNotes').value; S.logo=tmpLogo;
  if(!store.set('fk_settings',S))return;
  if(!doc.id&&!dirty){doc.number=toFa(S.next);doc.tax=S.tax?toFa(S.tax):'';doc.notes=S.notes}
  renderAll(); $('#dlgSettings').close(); toast('تنظیمات ذخیره شد');
});
document.querySelectorAll('dialog [data-close]').forEach(b=>b.addEventListener('click',()=>b.closest('dialog').close()));
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close()}));

/* ---------- backup ---------- */
$('#btnExport').addEventListener('click',()=>{
  const data={app:'factorino',settings:S,invoices:store.get('fk_inv',[])};
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));
  a.download='factorino-backup.json'; document.body.appendChild(a); a.click(); a.remove();
});
$('#fImport').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(d.app!=='factorino')throw 0;
      if(!confirm('اطلاعات فعلی با پشتیبان جایگزین شود؟'))return;
      S=Object.assign(S,d.settings||{}); store.set('fk_settings',S); store.set('fk_inv',d.invoices||[]);
      doc=newDoc(); dirty=false; renderAll(); $('#dlgSettings').close(); toast('پشتیبان بازیابی شد');
    }catch(err){toast('فایل پشتیبان معتبر نیست')}
  };
  r.readAsText(f); e.target.value='';
});

/* ---------- install + service worker ---------- */
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('#btnInstall').hidden=false});
$('#btnInstall').addEventListener('click',async()=>{
  if(!deferred)return; deferred.prompt(); await deferred.userChoice; deferred=null; $('#btnInstall').hidden=true;
});
window.addEventListener('appinstalled',()=>{$('#btnInstall').hidden=true});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

renderAll();
window.__fk={words,g2j,num,money};
})();
</script>
</body>
</html>
